<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企业 AI 工作台 · 统一入口</title>
  <style>
    :root { --bg:#f5f7fa; --panel:#ffffff; --border:#e3e8ef; --text:#1f2933; --muted:#66707a; --brand:#2563eb; --ok:#16a34a; --bad:#dc2626; --chip:#eef2f7; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif; background:linear-gradient(160deg,#eef4ff 0%,#f5f7fa 40%,#eefaf2 100%); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:34px 36px; width:480px; max-width:94vw; box-shadow:0 12px 40px rgba(37,99,235,.08); }
    h1 { font-size:21px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:13px; margin-bottom:22px; }
    label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
    .keyrow { display:flex; gap:8px; }
    input { flex:1; padding:11px 12px; border:1px solid var(--border); border-radius:10px; font:inherit; font-size:14px; }
    button { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:11px 18px; font:inherit; cursor:pointer; font-size:14px; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .msg { font-size:12.5px; margin-top:10px; min-height:18px; }
    .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
    .apps { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
    .app { border:1px solid var(--border); border-radius:12px; padding:16px; cursor:pointer; transition:.15s; background:#fff; text-decoration:none; color:inherit; display:block; }
    .app:hover { border-color:var(--brand); box-shadow:0 6px 18px rgba(37,99,235,.12); transform:translateY(-1px); }
    .app .ic { font-size:26px; }
    .app .t { font-weight:700; font-size:14.5px; margin:8px 0 4px; }
    .app .d { font-size:12px; color:var(--muted); line-height:1.5; }
    .app.disabled { opacity:.45; pointer-events:none; }
    .note { background:var(--chip); border-radius:10px; padding:10px 12px; font-size:12px; color:var(--muted); margin-top:18px; line-height:1.6; }
    .note b { color:var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🤖 企业 AI 工作台 · 统一入口</h1>
    <div class="sub">一把共享访问密钥，同时使用「论文检索助手」与「多智能体方案工作流」</div>

    <label for="key">X-API-Key（由管理员签发，两个项目通用）</label>
    <div class="keyrow">
      <input id="key" type="password" placeholder="粘贴访问密钥" autocomplete="off" />
      <button id="btn" onclick="verifyKey()">验证并进入</button>
    </div>
    <div class="msg" id="msg"></div>

    <div class="apps" id="apps"></div>

    <div class="note">
      <b>密钥管理</b>：访问密钥由管理员在「项目一 · 设置面板」用 Admin Key 轮换；
      轮换后新密钥立即全站生效，旧密钥作废。本页面不保存任何密钥信息。
    </div>
  </div>

<script>
const KEY_STORE = "p2_api_key";
const apps = [
  { icon:"📄", t:"项目一 · 论文检索助手", d:"论文/研报语义检索、引用溯源、问答评测（80 端口）", url:"http://101.245.96.205/insight", external:true },
  { icon:"🧠", t:"项目二 · 多智能体工作流", d:"规划→检索→分析→撰写→评审，节点图实时追踪", url:"/workbench", external:false },
];

function renderApps(valid) {
  const box = document.getElementById("apps");
  box.innerHTML = apps.map(a => `
    <a class="app" href="${a.url}" ${a.external ? 'target="_blank" rel="noopener"' : ""}>
      <div class="ic">${a.icon}</div>
      <div class="t">${a.t}</div>
      <div class="d">${a.d}</div>
    </a>`).join("");
}

async function verifyKey() {
  const key = document.getElementById("key").value.trim();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");
  if (!key) { msg.className = "msg bad"; msg.textContent = "请先输入访问密钥"; return; }
  btn.disabled = true;
  msg.className = "msg"; msg.textContent = "正在向密钥服务验证…";
  try {
    const r = await fetch("/verify-key", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ api_key: key }),
    });
    const d = await r.json();
    if (d.valid) {
      localStorage.setItem(KEY_STORE, key);
      msg.className = "msg ok";
      msg.textContent = "✅ 密钥有效，请选择要进入的项目：";
      renderApps(true);
    } else {
      msg.className = "msg bad";
      msg.textContent = "❌ 密钥无效或已失效（请让管理员重新签发）";
      renderApps(false);
    }
  } catch (e) {
    msg.className = "msg bad";
    msg.textContent = "验证失败：" + e.message;
    renderApps(false);
  } finally {
    btn.disabled = false;
  }
}

(function init() {
  document.getElementById("key").value = localStorage.getItem(KEY_STORE) || "";
  document.getElementById("key").addEventListener("keydown", e => { if (e.key === "Enter") verifyKey(); });
  renderApps(false);
  if (document.getElementById("key").value) verifyKey();
})();
</script>
</body>
</html>
